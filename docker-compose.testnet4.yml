# Testnet4 compose skeleton for Neapolitan (neop).
# Engines are pinned validation binaries — do not reimplement PoW here.
# Copy .env.example → .env before up. Datadir: ./data/testnet4 (never mainnet volumes).
# Pins: engines/pins.toml
# Explorer: https://mempool.guide/testnet4

services:
  bitcoind-legacy:
    image: bitcoin/bitcoin:placeholder
    profiles: ["engines"]
    restart: unless-stopped
    command:
      - -testnet4
      - -server=1
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -rpcuser=${LEGACY_RPC_USER}
      - -rpcpassword=${LEGACY_RPC_PASSWORD}
    volumes:
      - ./data/testnet4/legacy:/data
    ports:
      - "18332:18332"
    networks:
      - neop-testnet4

  bitcoind-blake2b:
    # Pin Knots Blake2b (#359 lineage) — not stock Knots. See engines/pins.toml.
    image: neop/knots-blake2b:placeholder
    profiles: ["engines"]
    restart: unless-stopped
    command:
      - -testnet4
      - -server=1
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -rpcuser=${BLAKE2B_RPC_USER}
      - -rpcpassword=${BLAKE2B_RPC_PASSWORD}
    volumes:
      - ./data/testnet4/blake2b:/data
    ports:
      - "18333:18332"
    networks:
      - neop-testnet4

  neopd:
    build: .
    image: neop/neopd:local
    profiles: ["neopd"]
    restart: unless-stopped
    environment:
      NEOP_NETWORK: testnet4
      NEOP_DATADIR: /data
      NEOP_BIND: 0.0.0.0
      NEOP_PORT: "18334"
      LEGACY_RPC_URL: http://bitcoind-legacy:18332
      BLAKE2B_RPC_URL: http://bitcoind-blake2b:18332
      LEGACY_RPC_USER: ${LEGACY_RPC_USER}
      LEGACY_RPC_PASSWORD: ${LEGACY_RPC_PASSWORD}
      BLAKE2B_RPC_USER: ${BLAKE2B_RPC_USER}
      BLAKE2B_RPC_PASSWORD: ${BLAKE2B_RPC_PASSWORD}
    volumes:
      - ./data/testnet4:/data
    ports:
      - "18334:18334"
    networks:
      - neop-testnet4

  electrum-legacy:
    # Fulcrum only — classic 80-byte headers. Image placeholder.
    image: cculianu/fulcrum:placeholder
    profiles: ["electrum"]
    restart: unless-stopped
    ports:
      - "15001:50001"
    volumes:
      - ./data/testnet4/electrum/delta-legacy:/data
    networks:
      - neop-testnet4

  electrum-blake2b:
    # Shulcrum (Kilombino) — variable headers + pow_algorithms. See vendor/README.md.
    image: neop/shulcrum:placeholder
    profiles: ["electrum"]
    restart: unless-stopped
    ports:
      - "15011:50001"
    volumes:
      - ./data/testnet4/electrum/delta-blake2b:/data
    networks:
      - neop-testnet4

networks:
  neop-testnet4:
    name: neop-testnet4
