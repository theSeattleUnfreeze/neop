name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Ensure store smoke
        run: python -m neopd --ensure-store --datadir /tmp/neop-ci --network testnet4
      - uses: actions/setup-node@v4
        if: hashFiles('scoop/package.json') != ''
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: scoop/pnpm-lock.yaml
      - name: Run scoop tests
        if: hashFiles('scoop/package.json') != ''
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
          cd scoop
          pnpm install --frozen-lockfile
          pnpm test
