# Optional Scoop UI + Postgres. Fulcrum/Shulcrum stay on the host (or another compose).
#   docker compose -f docker-compose.scoop.yml --profile scoop up --build
services:
  postgres-scoop:
    image: postgres:16-alpine
    profiles: ["scoop"]
    environment:
      POSTGRES_USER: scoop
      POSTGRES_PASSWORD: scoop
      POSTGRES_DB: scoop
    # No host port — Scoop reaches Postgres on the compose network only.
    volumes:
      - scoop-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoop -d scoop"]
      interval: 2s
      timeout: 5s
      retries: 10

  scoop:
    profiles: ["scoop"]
    build:
      context: ./scoop
      dockerfile: Dockerfile
    depends_on:
      postgres-scoop:
        condition: service_healthy
    environment:
      SCOOP_DATABASE_URL: postgres://scoop:scoop@postgres-scoop:5432/scoop
      FULCRUM_URL: ${FULCRUM_URL:-tcp://host.docker.internal:15001}
      SHULCRUM_URL: ${SHULCRUM_URL:-tcp://host.docker.internal:15011}
      # StartOS Electrum SSL uses a self-signed cert; set to 0 to enforce CA verify.
      SCOOP_ELECTRUM_TLS_INSECURE: ${SCOOP_ELECTRUM_TLS_INSECURE:-1}
    ports:
      - "127.0.0.1:3847:3847"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  scoop-pg:
